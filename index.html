<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Pagos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HU-01: Pantalla de inicio de sesión -->
  <section id="vista-login" class="login">
    <form id="form-login" class="tarjeta login-caja" novalidate>
      <h1>Control de Pagos</h1>
      <p class="sub">Gastos variables del negocio</p>
      <label>Usuario
        <input id="login-usuario" autocomplete="username">
      </label>
      <label>Contraseña
        <input id="login-clave" type="password" autocomplete="current-password">
      </label>
      <p id="login-error" class="error" hidden>Usuario o contraseña incorrectos</p>
      <button class="btn primario" type="submit">Ingresar</button>
    </form>
  </section>

  <!-- Pantalla principal: solo se muestra con la sesión iniciada -->
  <div id="vista-app" hidden>
    <header class="barra">
      <strong class="marca">Control de Pagos</strong>
      <span class="usuario">Sesión: <b id="usuario-actual"></b></span>
      <button id="btn-salir" class="btn">Cerrar sesión</button>
    </header>

    <main class="contenido">
      <div class="mes-nav">
        <h2 id="mes-titulo"></h2>
      </div>

      <!-- HU-03: Lista de pagos del mes -->
      <section class="tarjeta">
        <div class="lista-cabecera">
          <h3>Pagos del mes</h3>
          <label class="filtro">Estado
            <select id="filtro-estado">
              <option value="todos">Todos</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Vencido">Vencido</option>
              <option value="Pagado">Pagado</option>
            </select>
          </label>
          <button id="btn-nuevo" class="btn primario solo-asistente">+ Registrar pago</button>
        </div>

        <table id="tabla-pagos" class="tabla">
          <thead>
            <tr>
              <th>Beneficiario</th>
              <th>Concepto</th>
              <th>Tipo</th>
              <th class="num">Monto</th>
              <th>Vencimiento</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="lista-vacia" class="vacio" hidden></p>
      </section>
    </main>
  </div>

  <!-- HU-02: Formulario para registrar un pago (una sola pantalla) -->
  <dialog id="dlg-pago">
    <form id="form-pago" novalidate>
      <h3 id="pago-titulo">Registrar pago</h3>

      <label>¿A quién se paga? (beneficiario)
        <input name="beneficiario" placeholder="Ej. Hidrandina, SUNAT, Distribuidora Norte">
      </label>
      <small class="campo-error" data-para="beneficiario"></small>

      <label>Concepto
        <input name="concepto" placeholder="Ej. Luz de octubre">
      </label>
      <small class="campo-error" data-para="concepto"></small>

      <div class="fila-2">
        <div>
          <label>Tipo de pago
            <select name="tipo">
              <option value="">Elige…</option>
              <option>Servicio</option>
              <option>Proveedor</option>
              <option>Impuesto</option>
              <option>Préstamo</option>
            </select>
          </label>
          <small class="campo-error" data-para="tipo"></small>
        </div>
        <div>
          <label>Monto (S/)
            <input name="monto" inputmode="decimal" placeholder="150.50">
          </label>
          <small class="campo-error" data-para="monto"></small>
        </div>
      </div>

      <label>Fecha de vencimiento
        <input name="vencimiento" type="date">
      </label>
      <small class="campo-error" data-para="vencimiento"></small>

      <div class="dialogo-botones">
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button type="submit" class="btn primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- HU-04: Marcar como pagado y adjuntar voucher -->
  <dialog id="dlg-voucher">
    <form id="form-voucher" novalidate>
      <h3 id="voucher-titulo">Marcar como pagado</h3>
      <p id="voucher-detalle" class="sub"></p>

      <div id="campos-pago" class="fila-2">
        <div>
          <label>Fecha de pago
            <input name="fechaPago" type="date">
          </label>
          <small class="campo-error" data-para="fechaPago"></small>
        </div>
        <div>
          <label>Medio de pago
            <select name="medio">
              <option value="">Elige…</option>
              <option>Agente</option>
              <option>App del banco</option>
              <option>Efectivo</option>
              <option>Tarjeta</option>
            </select>
          </label>
          <small class="campo-error" data-para="medio"></small>
        </div>
      </div>

      <label>Voucher (foto o PDF)
        <input name="archivo" type="file" accept="image/*,application/pdf">
      </label>
      <small class="campo-error" data-para="archivo"></small>

      <div class="dialogo-botones">
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button type="submit" class="btn primario" id="voucher-confirmar">Confirmar pago</button>
      </div>
    </form>
  </dialog>

  <!-- HU-04: Ver el voucher adjunto -->
  <dialog id="dlg-ver" class="dialogo-ancho">
    <h3 id="ver-titulo">Voucher</h3>
    <p id="ver-detalle" class="sub"></p>
    <div id="ver-contenido" class="voucher-vista"></div>
    <div class="dialogo-botones">
      <a id="ver-descargar" class="btn" download>Descargar</a>
      <button type="button" class="btn primario" data-cerrar>Cerrar</button>
    </div>
  </dialog>

  <div id="aviso" class="aviso" hidden></div>

  <script src="app.js"></script>
</body>
</html>
